file:
  filePath: "files/" # 파일을 저장할 위치 설정
  fileTypes: # 파일 업로드를 허용할 파일 확장자 설정
    - ".txt"
    - ".pdf"
    - ".jpg"
    - ".jpeg"
    - ".png"
    - "" # 파일 확장자가 없는 경우
  imageTypes: # 장소 사진 업로드를 허용할 이미지 확장자 설정 (대소문자 무시, 파일 내용 시그니처도 함께 검사)
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".webp"
