spring:
  application:
    name: pick-place-api
  config:
    import:
      - classpath:/prop/file.yml
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pickplace?characterEncoding=UTF-8&allowMultiQueries=true
    username: pickplace
    password: pickplace
  jpa:
    hibernate:
      ddl-auto: none # TODO - 항상 none 인지 확인
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 300MB
  server:
    servlet:
      session:
        timeout: 7d
        cookie:
          http-only: true
          same-site: lax
          secure: ${SESSION_COOKIE_SECURE:false}
