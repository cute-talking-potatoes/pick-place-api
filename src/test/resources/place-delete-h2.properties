# PlaceDeleteIntegrationTest 전용 설정 (@TestPropertySource로 해당 테스트 클래스에만 적용)
# - 인메모리 H2(MySQL 호환 모드)를 사용하며 실제 자격증명이 아니다.
# - LOCK_TIMEOUT을 짧게 두어 비관적 락 대기를 결정적으로(타임아웃 예외로) 검증한다.
spring.datasource.url=jdbc:h2:mem:place-delete-it;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=500
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.generate_statistics=true
